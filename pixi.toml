[workspace]
authors = ["Shuqi XIAO <xiaosq2000@gmail.com>"]
channels = ["conda-forge"]
name = "record3d"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
cmake = "<4"      # required by ros-noetic
numpy = "<2"      # required by ros-noetic
opencv = "4.10.*" # required by ros-noetic
python = "3.11.*"
setuptools = "*"

[pypi-dependencies]
record3d = { path = ".", editable = true }

[feature.ros-noetic]
channels = ["robostack-noetic", "conda-forge"]

[feature.ros-noetic.dependencies]
ros-noetic-desktop = "*"

[feature.ros-noetic.pypi-dependencies]
catkin-tools = "*"

[feature.ci.dependencies]
mypy = ">=1.18.2,<2"
pre-commit = ">=4.3.0,<5"
ruff = ">=0.14.3,<0.15"
taplo = ">=0.10.0,<0.11"

[feature.ci.tasks]
ci = { depends-on = ["pre-commit-run"] }
pre-commit-install = "pre-commit install --install-hooks"
pre-commit-run = "pre-commit run --all-files --hook-stage=manual"
ruff-format = "ruff format --force-exclude"
ruff-lint = "ruff check --fix --force-exclude --exit-non-zero-on-fix"
toml-format = { cmd = "taplo fmt", env = { "RUST_LOG" = "warn" } }
toml-lint = { cmd = "taplo lint", env = { "RUST_LOG" = "warn" } }

[environments]
ci = { features = ["ci"], no-default-feature = true }
default = { features = ["ros-noetic"] }
