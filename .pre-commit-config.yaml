exclude: (^.pixi/|.snap|libs/)
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.3.0
  hooks:
    - id: conventional-pre-commit
      stages: [commit-msg]
      args: []
- repo: local
  hooks:
    - id: toml-lint
      name: TOML lint
      entry: pixi run --environment=ci toml-lint
      language: system
      types: [file, toml]
      require_serial: true
      stages: [pre-commit, pre-merge-commit, pre-push, manual]
    - id: toml-format
      name: TOML format
      entry: pixi run --environment=ci toml-format
      language: system
      types: [file, toml]
      require_serial: true
      stages: [pre-commit, pre-merge-commit, pre-push, manual]
    - id: ruff
      name: Ruff lint
      entry: pixi run --environment=ci ruff-lint
      language: system
      types_or: [python, pyi]
      require_serial: true
      stages: [pre-commit, pre-merge-commit, pre-push, manual]
    - id: ruff-format
      name: Ruff format
      entry: pixi run --environment=ci ruff-format
      language: system
      types_or: [python, pyi]
      require_serial: true
      stages: [pre-commit, pre-merge-commit, pre-push, manual]
    - id: mypy
      name: mypy
      entry: pixi run --environment=ci mypy
      language: system
      types: [python]
      require_serial: true
      stages: [manual]
